<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishGuard Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b1a;
        color: #f4f7ff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 520px;
        background: #10162f;
        border: 2px solid #38e8ff;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 0 24px rgba(56, 232, 255, 0.25);
      }

      h1 {
        color: #39ff88;
      }

      p {
        color: #9aa4c7;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>PhishGuard Offline</h1>
      <p>
        You are currently offline. Previously loaded pages may still work, but URL scanning requires connection to the backend server.
      </p>
    </div>
  </body>
</html>
